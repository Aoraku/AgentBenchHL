schema_version: "1.0"
game: antwar2
origin: from_scratch
provider:
  model: gpt-5.6
  reasoning_effort: xhigh
  base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
  api_key_env: ABHL_API_KEY
  disable_response_storage: true
runtime:
  codex_binary: codex
  branch_width: 1
  max_iterations: null
  network_access: disabled
paths:
