# 烟测配置模板 —— 用来验收一个游戏是否真的接通了。
#
# 与 exp2-*-conquest.yaml 的区别（以及为什么要单独一份）
# ----------------------------------------------------
# 主线配置是"无限迭代爬梯"，一轮就要十几分钟、几十万 token。用它做验收会把
# "游戏接得对不对"和"模型能不能爬梯"两件事混在一起——某个游戏跑挂了，
# 分不清是探针写错了还是这一轮模型正好写了个坏策略。
#
# 烟测只回答一个问题：**这个游戏的全链路能不能连续跑完 4 轮不死**。
# 链路 = 候选生成 → 隔离编译 → 对局 → 回放解码 → 叙述 → 精确 IG 探针 → 指标落盘。
# 所以：
#   * max_iterations: 4（够暴露"第 2 轮才出现"的状态类 bug，如 thread 轮转、
#     幂等键、feedback 累积；1 轮跑通说明不了什么）
#   * rollout_k: 2（每轮 2 个候选就足以触发多样性检查与配对 IG）
#   * development_seeds: [1]（单 seed，验收不需要泛化性）
#   * opponent_policy: fixed_rank + 靠后的名次（验收不需要打赢，只需要跑完；
#     打太强的对手会让 4 轮全 0 胜率，掩盖"对局其实没跑起来"）
#
# 用法：
#   scripts/smoke_game.py --game <game>   # 会由该脚本渲染出实际配置
#
# ⚠️ provider 段用的是 teamorouter 中转（临时）。以后回到 tsinghua 中转时
# 只需要改 base_url / api_key_env / model 三项，其余保持不动。
budget:
  # 烟测必须有硬上限：跑挂了不能无限烧钱。
  # 4 轮 × 2 候选，正常在 300k token / 90 分钟内完成；给 3 倍余量。
  tokens: 3000000
  wall_seconds: 10800
curriculum:
  advance_min_matches: 2
  advance_streak: 1
  advance_win_rate: 0.6
  development_seeds:
  - 1
  ladder_scope: auto
  # 固定打一个中游对手：验收看的是"链路是否跑通"，不是"能否取胜"。
  # 打榜首会导致 4 轮全败，而全败与"对局根本没跑起来"在指标上不易区分。
  opponent_policy: fixed_rank
  opponent_rank: 30
  opponent_start_rank: null
  order: lowest_rank_first
  seed_mode: fixed
game: PLACEHOLDER
goal:
  code_constraint: any
  experience_skills: true
  history_mode: full
  prompt_override: null
  seed_policy_path: null
isolation:
  backend: auto
  docker_image: null
  rival_code_visible: false
measurement:
  epsilon: 0.01
  information_gain: true
  # 必须开：精确 IG 探针是本次验收的**主要目标**之一。
  # 探针崩了会让 behavioral_ig 静默退回字母表近似（见 LESSONS_LEARNED B 条），
  # 所以烟测结束后要检查 support_mode 而不是只看"有没有报错"。
  behavioral_ig_cases: 1
  behavioral_ig_timeout_s: 900
origin: from_scratch
paths:
  agentbench_root: ${AGENTBENCH_ROOT}
  runs_root: ../../../runs
provider:
  api_key_env: ABHL_API_KEY
  # ⚠️ base_url 会被**直接拼接** codex 的请求路径（``/responses``），见
  # adapters/codex_goal/responses_proxy.py 的 `path = upstream.path + self.path`。
  # teamorouter 的端点是 `/v1/responses`，所以这里必须带 `/v1`；
  # 漏掉会拿到 404（返回的还是 HTML 首页，报错信息极具误导性）。
  # 对比：tsinghua 中转的 `.../sub2api` 自身就是根，不带 `/v1`。
  base_url: https://api.teamorouter.com/v1
  disable_response_storage: true
  harness: codex
  model: gpt-5.6-luna
  reasoning_effort: high
  # gpt-5.6-luna 是 OpenAI 家的模型，codex 自带元数据，不需要 model_catalog。
  # 换成 glm / kimi 等非自家模型时**必须**补 model_catalog，否则 codex 用
  # fallback 元数据、压缩会在一个没设过的点触发并打死整个 run（LESSONS_LEARNED A 条）。
  auto_compact_token_limit: 900000
runtime:
  agent_binary: null
  branch_width: 1
  codex_binary: codex
  match_parallelism: 4
  match_timeout_s: 1800
  max_iterations: 4
  network_access: disabled
  rollout_k: 2
  # 每轮换线程：躲开 codex 的 remote compaction（LESSONS_LEARNED A 条）。
  # 烟测 4 轮也要开——正是为了验证轮转路径本身没问题。
  thread_rotate_each_iteration: true
  thread_rotate_context_tokens: 60000
schema_version: '1.1'
