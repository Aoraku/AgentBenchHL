# 实验 4：agent 能否看到自己的历史迭代。三组只差 goal.history_mode。
# 本组：memoryless —— 再删历史候选目录与历次 action 原文，每轮开新会话；只留当前代码 + 上一轮反馈。
# 刻意保留最近一份对局反馈：一点结果都不给的话，消融掉的是学习信号
# 而不是历史记忆，那就换了题目。
budget:
  tokens: 60000000
  wall_seconds: null
curriculum:
  advance_min_matches: 2
  advance_streak: 1
  advance_win_rate: 0.6
  development_seeds:
  - 1
  - 2
  ladder_scope: auto
  opponent_policy: ladder_up
  opponent_rank: null
  opponent_start_rank: 10
  order: lowest_rank_first
  seed_mode: fixed
evaluation:
  # ★ 消融实验只看**终局名次**，所以不开中间版本的慢评测。
  #
  # 消融要回答的是"同样迭代 N 轮之后，哪一组在 229 人池里排得更高"——那是一个
  # 数字，不需要整条曲线。迭代跑完之后用 scripts/final_elo.sh 只测末轮那一版，
  # 成本差一个数量级（实测 4 个 run：50 版 22900 局 ≈ 17h vs 4 版 1832 局 ≈ 1.6h），
  # 而且那时机器是空的，不和迭代抢机时。
  #
  # 开着它的代价是实测过的：它**每个 run 起一个 worker**，而 CPU 水位控制是
  # 各自判断的（每个 worker 等 `load + headroom <= 总核数`），于是 N 个 worker
  # 会同时看到"还有余量"然后一起下水 —— 每个都"预留 8 核"等于谁也没预留。
  # 16 个 run 时实测 load 冲到 40/32，迭代慢 10~20 倍，而 45 个排队版本
  # **一个都没测完**。详见 USER_GUIDE §4。
  #
  # 需要曲线的只有主线实验（exp2/exp3），它们显式开 true。
  background_pool: false
  pool_sample: 16
  pool_seeds:
  - 7
game: antwar2
goal:
  code_constraint: any
  experience_skills: true
  history_mode: memoryless
  prompt_override: null
  seed_policy_path: null
isolation:
  backend: auto
  docker_image: null
  rival_code_visible: false
measurement:
  epsilon: 0.01
  information_gain: true
  # 决策级行为信息增益：每轮拿 1 个配对 case 做线协议录制 + 冻结重放
  # （成本 = 2 局录制对局 + 2 次本地重放）。0 = 关闭，曲线会记 null + 原因。
  behavioral_ig_cases: 1
  behavioral_ig_timeout_s: 900
origin: from_scratch
paths:
  agentbench_root: ${AGENTBENCH_ROOT}
  runs_root: ../../../runs
provider:
  api_key_env: ABHL_API_KEY
  base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
  disable_response_storage: true
  harness: codex
  model: glm-5.2
  # reasoning_effort 直接决定 agent 每次写多少 token。实测同一 prompt：
  #   low   -> 336 output tokens / 3.6s
  #   xhigh -> 1113 output tokens / 10.1s   （量 ×3.3）
  # 模型本身很快（TTFT ~1s、93~110 tok/s），慢是因为 xhigh 让它写太多。
  # 一轮迭代约 35k output tokens ≈ 318s，占该轮 850s 的 37%；
  # 其余 63% 是 agent 自己在跑本地对局验证。
  # 取 high：砍掉大部分冗余推理，又不像 low 那样明显掉代码质量。
  # ⚠️ 这是**实验参数**：所有配置必须用同一档，否则主表跨模型/跨 harness 不可比。
  reasoning_effort: high
  # glm-5.2 不在 codex 自带的模型目录里（`codex debug models` 只返回自家模型），
  # 不配这两项就会 "Unknown model … will use fallback model metadata"，
  # 上下文窗口与压缩阈值全走兜底值。codex 0.147 只认这两个字段。
  #
  # context_window: 1M —— **当前是待核实的假设**（同事尚未回参数）。
  # auto_compact_token_limit: 对话历史涨到这里就自动压缩。实测一个 2 轮 run 的
  #   input token 从 5888 涨到 219571（膨胀全来自 agent 自己的工具调用历史），
  #   期间从未触发压缩；实验二要跑 30~50 轮，不压缩必然撑爆窗口。
  #
  # ⚠️ 本组（history_mode 消融）刻意把阈值顶到 = 窗口，即**实际不压缩**。
  #   自动压缩本身就是"看不到完整历史"，如果 history_full 被压缩、memoryless 也被压缩，
  #   两组之间就多出了一个不受控变量，消融结论不再干净。
  #   实验 4 的三份配置必须用**同一个**阈值，差异只允许来自 history_mode。
  #   代价：轮数多了 context 会很贵；所以这组请用固定的较小 iterations。
  context_window: 1000000
  auto_compact_token_limit: 1000000
runtime:
  agent_binary: null
  branch_width: 1
  codex_binary: codex
  match_parallelism: 4
  match_timeout_s: 1800
  max_iterations: 30
  network_access: disabled
  rollout_k: 4
schema_version: '1.1'
