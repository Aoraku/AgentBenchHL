# Goal-led（Plan I）实验配置模板 —— 服务端按表单填充后落到 run 目录。
# 每个字段都有真实消费点；改这里就是改实验行为。
schema_version: "1.1"
game: antwar2                 # 任何 gamepacks/<game>/ 存在的游戏
origin: from_scratch          # from_scratch | seeded（seeded 需 goal.seed_policy_path）

provider:
  harness: codex              # codex | cc（Claude Code）
  model: gpt-5.6              # 中转站可用模型名
  # reasoning_effort 直接决定 agent 每次写多少 token。实测同一 prompt：
  #   low   -> 336 output tokens / 3.6s
  #   xhigh -> 1113 output tokens / 10.1s   （量 ×3.3）
  # 模型本身很快（TTFT ~1s、93~110 tok/s），慢是因为 xhigh 让它写太多。
  # 一轮迭代约 35k output tokens ≈ 318s，占该轮 850s 的 37%；
  # 其余 63% 是 agent 自己在跑本地对局验证。
  # 取 high：砍掉大部分冗余推理，又不像 low 那样明显掉代码质量。
  # ⚠️ 这是**实验参数**：所有配置必须用同一档，否则主表跨模型/跨 harness 不可比。
  reasoning_effort: high
  # glm-5.2 不在 codex 自带的模型目录里（`codex debug models` 只返回自家模型），
  # 不配这两项就会 "Unknown model … will use fallback model metadata"，
  # 上下文窗口与压缩阈值全走兜底值。codex 0.147 只认这两个字段。
  #
  # context_window: 1M —— **当前是待核实的假设**（同事尚未回参数）。
  # auto_compact_token_limit: 对话历史涨到这里就自动压缩。实测一个 2 轮 run 的
  #   input token 从 5888 涨到 219571（膨胀全来自 agent 自己的工具调用历史），
  #   期间从未触发压缩；实验二要跑 30~50 轮，不压缩必然撑爆窗口。
  #   取 600k（60% 窗口）：留 40% 余量给单轮的大量工具输出，又不至于频繁丢历史。
  context_window: 1000000
  auto_compact_token_limit: 600000
  base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
  api_key_env: ABHL_API_KEY
  disable_response_storage: true

runtime:
  codex_binary: codex         # 服务器上建议写绝对路径 /opt/codex/bin/codex
  agent_binary: null          # cc harness 的可执行（null=用 codex_binary）
  branch_width: 1
  rollout_k: 4                # 每轮候选数（注入 Goal 指令并参与调度）
  match_parallelism: 8        # 一轮内对局并行度（32 核服务器的关键旋钮）
  max_iterations: null        # null + CLI 不给 --iterations = 不限轮数（须设 budget）
  match_timeout_s: 1800       # 单局墙钟上限（snakego 单局实测 246s，420s 会误杀长局）
  network_access: disabled

isolation:
  backend: auto               # auto|seatbelt|bubblewrap|docker|disabled
  rival_code_visible: false   # 消融：true 时把对手源码放进 rival-source/
  docker_image: null

budget:
  tokens: null                # token 预算上限（达到即停）
  wall_seconds: null          # 墙钟预算上限

curriculum:
  order: lowest_rank_first
  development_seeds: [1, 2]
  opponent_policy: fixed_top  # self_decide|fixed_top|ladder_up|ladder_down|fixed_rank|random|k_diverse
  opponent_rank: null         # fixed_rank 时必填
  opponent_start_rank: null   # ladder_up 默认 10（10→1）；ladder_down 默认 1（1→N）
  advance_min_matches: 2      # 对当前目标至少打这么多局才判定晋级
  advance_win_rate: 0.6       # 得分率门槛（平局算 0.5）
  advance_streak: 1           # 连续几轮达标才推进到下一个对手
  ladder_scope: auto          # auto|official|reference|measured；auto=逐选手回落 measured→reference→official
  seed_mode: fixed            # fixed=只用第一个 seed；generalize=全部 seed

goal:
  prompt_override: null       # 留空=默认目标（刷 SOTA）
  experience_skills: true     # 是否维护迭代经验文档
  history_mode: full          # full|no_notes|memoryless（实验 4 的消融开关）
  code_constraint: any        # any | if_else（仅可解释规则）
  seed_policy_path: null      # origin=seeded 时的起点策略

evaluation:
  background_pool: true       # 慢通道：中间版本对全池抽样评测算 Elo/胜率
  pool_sample: 16             # 抽样对手数（分层）
  pool_seeds: [7]

measurement:
  epsilon: 0.01
  information_gain: true      # 结果分布 IG（配对影子对局），全游戏可得
  # 决策级行为 IG（nats/决策）：每轮拿几个配对 case 做线协议录制 + 冻结重放。
  # |A| 与动作口径来自 A 仓 games/<game>/decision_space.yaml 的 information_gain 段；
  # 每个 case 的成本 = 2 局录制对局 + 2 次本地重放。0 = 关闭（曲线记 null + 原因）。
  behavioral_ig_cases: 1
  behavioral_ig_timeout_s: 900

paths:
  agentbench_root: ${AGENTBENCH_ROOT}
  runs_root: ../../../runs
