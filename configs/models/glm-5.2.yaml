# GLM-5.2（清华 sub2api）—— 8 游戏烟测的主用模型。
#
# 形状与 glm-5.3.yaml 完全一致，注意事项也一样（照抄 sota-antwar2 的 run）：
# 小写 slug、auto_compact 900000、不加 client_name。理由见 glm-5.3.yaml 的注释。
model: glm-5.2
base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
api_key_env: ABHL_KEY_GLM
harness: codex
reasoning_effort: high
# 内置 ZHIPU_MODEL_CATALOG 收录了 glm-5.3 / glm-5-turbo / glm-5.2 / glm-5
# （都是小写 slug），所以这里不需要再声明 context_window。
# 中转普遍不支持服务端 response storage，不关掉会在续接 turn 时
# 找不到上一条 response。旧 run（跑通 40+ 轮）就是这么配的。
disable_response_storage: true
model_catalog: zhipu
auto_compact_token_limit: 900000
