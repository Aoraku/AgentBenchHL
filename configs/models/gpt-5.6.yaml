# GPT-5.6 —— OpenAI 家模型，codex 自带元数据，不需要 model_catalog。
#
# ⚠️ base_url 与 key 待确认：teamorouter 曾被 SNI 阻断（TLS 握手就断，
# 不是 401 也不是超时），所以这里先留原端点，实际可用性以连通性探测为准。
# base_url 带 /v1：teamorouter 的端点是 /v1/responses。
model: gpt-5.6
base_url: https://api.teamorouter.com/v1
api_key_env: ABHL_KEY_GPT56
harness: codex
# 报 codex 官方 originator。不写会用框架默认 agentbench-hl，
# 可能被中转的客户端白名单拒绝，而报错会指向"模型不支持"这个错误方向
# （实测 LongCat-2.0 就是这样被拒的）。
client_name: codex_exec
reasoning_effort: high
disable_response_storage: true
auto_compact_token_limit: 600000
