# LongCat-2.0（清华 sub2api）
#
# 实测 2026-08-23：codex exec 直通。
#
# 清华中转与 sbtunnel 的两处差异（配错就是 403/404，报错极具误导性）：
#   1. base_url **不带** /v1 —— sub2api 自身就是根，加了会 404 并返回 HTML 首页；
#   2. **不需要** client_name（它不按客户端白名单放行；sbtunnel 才需要）。
# requires_openai_auth 由框架统一写入 config.toml（两个中转都要），不在这里配。
# slug 用中转 /v1/models 返回的原样大写。
#
# 对比 glm 系为什么用小写：那是因为要匹配框架内置 ZHIPU_MODEL_CATALOG 的
# slug（codex 按 slug 精确匹配 catalog，不符就退回兜底元数据）。
# LongCat 没有 catalog，不存在匹配需求，就该用中转认的名字。
model: LongCat-2.0
base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
api_key_env: ABHL_KEY_LONGCAT
harness: codex
# ablation 要控变量：所有模型统一 high，保持横向可比。
reasoning_effort: high
disable_response_storage: true
# 900000：这个值是"引雷开关"不是"保险"——设低了会主动触发远程压缩，
# 而非 OpenAI 模型的远程压缩必定失败（返回两个 output item，codex 只收一个）。
# 真正控制上下文的是 thread_rotate_each_iteration（每轮换 thread 清零）。
# 900000 抄自跑通 40+ 轮的 sota-antwar2。
auto_compact_token_limit: 900000
