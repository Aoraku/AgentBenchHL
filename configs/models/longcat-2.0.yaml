# LongCat-2.0（清华 sub2api）
#
# 实测 2026-08-23：codex exec 直通。
#
# 清华中转与 sbtunnel 的两处差异（配错就是 403/404，报错极具误导性）：
#   1. base_url **不带** /v1 —— sub2api 自身就是根，加了会 404 并返回 HTML 首页；
#   2. **不需要** client_name（它不按客户端白名单放行；sbtunnel 才需要）。
# requires_openai_auth 由框架统一写入 config.toml（两个中转都要），不在这里配。
model: LongCat-2.0
base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
api_key_env: ABHL_KEY_LONGCAT
harness: codex
# ablation 要控变量：所有模型统一 high，保持横向可比。
# ★ 报 codex 官方 originator。
#
# 不配的话上游看到的是框架默认的 originator=agentbench-hl，而中转站可能按
# 客户端白名单放行。实测 LongCat-2.0 因此被拒：
#     400 {"code":"invalid_request_error",
#          "message":"Model is not supported by composite groups"}
# 这句报错极具误导性——它说的像是"模型不支持"，实际是"你这个客户端不被
# 允许调这个模型"。同一 key/端点/模型换成 codex_exec 就 200。
#
# 同一中转上 kimi-k3 与 GLM-5.x 不配也能通（它们不在受限分组里），
# 但没有理由赌哪个模型受限：统一报官方 originator。
client_name: codex_exec
reasoning_effort: high
disable_response_storage: true
# 非 OpenAI 家模型，codex 不认识它的元数据，压缩阈值取保守值。
# 框架靠 thread_rotate_each_iteration 保证远程压缩永不触发，这只是最后一道保险。
auto_compact_token_limit: 90000
