# GLM-5.3（清华 sub2api）
#
# ★ 这份配置照抄 sota-antwar2 那个跑通 40+ 轮的 run，**不要自作主张改**。
#
# 三个曾经被改坏的地方（每一处都让 run 直接死）：
#
# 1. `model` 必须是**小写** `glm-5.3`。
#    框架内置的 ZHIPU_MODEL_CATALOG 里 slug 就是小写，改成 /v1/models 返回的
#    大写 `GLM-5.3` 会让 catalog **匹配不上** → codex 退回兜底元数据
#    （很小的 context_window）→ 压缩在一个我们没设过的点触发 →
#    而 glm 系的远程压缩必定失败：
#        remote compaction v2 expected exactly one compaction output item,
#        got 0 from 2 output items
#    → 整个 run 死。中转本身**不区分大小写**，所以大写"看起来能用"
#    （curl 和 codex exec 都通），只有走框架时才炸。
#
# 2. `auto_compact_token_limit` 是 **900000**，不是 90000。
#    这个值不是"保险"而是"引雷开关"：设低了会主动触发上面那个必死的压缩。
#    真正防止上下文膨胀的是 thread_rotate_each_iteration（每轮换 thread，
#    上下文清零），阈值只需高到够**一轮**用。
#
# 3. **不要**加 `client_name`。旧 run 用框架默认的 originator=agentbench-hl
#    跑通了 40+ 轮 —— 清华中转不按客户端白名单放行，加了纯属多余。
#    （sbtunnel 才需要，见 gpt-5.6-sol.yaml。）
model: glm-5.3
base_url: https://lab.cs.tsinghua.edu.cn/ai-platform/sub2api
api_key_env: ABHL_KEY_GLM
harness: codex
reasoning_effort: high
# 必须给：不给的话 codex 不认识这个 slug，会走兜底元数据（同第 1 条的后果）。
# catalog 里声明 context_window = 1048576。
# 中转普遍不支持服务端 response storage，不关掉会在续接 turn 时
# 找不到上一条 response。旧 run（跑通 40+ 轮）就是这么配的。
disable_response_storage: true
model_catalog: zhipu
auto_compact_token_limit: 900000
