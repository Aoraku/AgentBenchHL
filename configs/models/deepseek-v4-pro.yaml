# DeepSeek V4 Pro（官方 API，不走中转）
#
# 实测 2026-08-23：`/v1/responses` 直通（`scripts/probe_responses_models.py`，1/1 可用）。
# 官方端点在 `/v1/models` 里只列 3 个模型：deepseek-v4-flash /
# deepseek-v4-flash-vision-exp / deepseek-v4-pro。
model: deepseek-v4-pro
# 官方端点是 `/v1/responses`，而 codex 把 `/responses` 直接拼在 base_url 后面，
# 所以这里必须带 `/v1`（清华 sub2api 自身就是根，那边才不带）。
base_url: https://api.deepseek.com/v1
api_key_env: ABHL_KEY_DEEPSEEK
harness: codex
reasoning_effort: high
disable_response_storage: true
# ★ 不写 client_name。
#
# 它**只**为 sbtunnel / teamorouter 那种按客户端白名单放行的中转而设
# （不写会被拒为 "This account only allows Codex official clients"）。
# 这里是 DeepSeek **官方** API，没有白名单这回事；给不需要的端点加这个字段
# 等于凭空造出一处与已验证配置的差异，而每一处差异都要重新验证一遍。
#
# ★ 上下文窗口：实测值，不是抄的。
#
# 没有 catalog 覆盖 deepseek，所以必须手写这个键 —— 不写的话 codex 报
# "Unknown model … will use fallback model metadata"，压缩线就变成一个
# 我们没设过、也看不见的数（实测 antwar2 在 97k 触发压缩并死掉，
# 而当时 config.toml 里写的是 200000）。
#
# 1048576 来自上游自己的报错（发一个超长输入换回来的）：
#     This model's maximum context length is 1048576 tokens.
context_window: 1048576
# ★ 这个值要设得**足够高，让远程压缩永不触发**，而不是"留个保险"。
#
# codex 的 remote compaction 对多数非 OpenAI 模型**必定失败**：
#     Error running remote compact task: Fatal error: remote compaction v2
#     expected exactly one compaction output item, got 0 from 2 output items
# （模型返回 [reasoning, message] 两个 item，codex v2 只接受一个）
# 一旦触发就把整个 turn 打成 failed，run 直接死。
#
# 所以阈值低 = 主动引雷。曾经写成 90000（比 900000 少一个 0），
# 于是 verify-glm-5.3 在第 0 轮、smoke8-miracle 在第 2 轮都被压缩打死；
# 而历史上跑通的 run（snakego4 / aquawar4 / g4 / m4）用的都是 900000。
#
# 真正防止上下文膨胀的是 thread_rotate_each_iteration：每轮换 thread，
# 上下文清零。那是在**轮末**生效的，所以轮内阈值必须高到够一轮用。
auto_compact_token_limit: 900000
