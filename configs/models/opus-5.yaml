# Claude Opus 5（teamorouter 中转，**cc harness**）
#
# ★ 这份档案与其它 7 个形状不同：它走 `harness: cc`（Claude Code），不是 codex。
#   原因不是偏好，是上游的硬性要求，见下。
#
# 三件实测确定的事（2026-08-23，api.teamorouter.cn）
# --------------------------------------------------
# 1. **域名必须是 .cn，不是 .com。**
#    `.com` 那个域在本机被按 SNI 阻断：同一个 IP，`-servername api.teamorouter.com`
#    的 ClientHello 直接被 RST（write:errno=104），换成别的 SNI 就能拿到证书链。
#    TLS1.2 / HTTP1.1 / 80 端口 / 两个 A 记录 / apex 域名全试过，一律 RST。
#    `.cn` 同一时刻 `/v1/models` 返回 200，列出 claude-opus-5。
#
# 2. **codex harness 走不通，这是上游明说的。**
#    打 `/v1/responses` 返回 400，报错原文：
#        当前请求模型为 claude-opus-5，请求协议为 OpenAI Responses API，
#        模型和协议不匹配……正确的请求协议为：Anthropic Messages API。
#    所以这不是配置能绕过去的，只能换 harness。
#
# 3. **cc 这条路是通的。** `/v1/messages` 与 `/v1/chat/completions` 都实测 200。
#    cc harness 起一个本地 AnthropicBridge：对 Claude Code 说 Anthropic 协议，
#    对上游翻译成 `/v1/chat/completions`。
#
# ⚠️ 跨 harness 比较时必须注明：cc 侧**没有** reasoning_effort 这个旋钮
#    （Anthropic 的 thinking 块在桥接里还原不了），所以 opus-5 的"推理深度"
#    与其余 7 个 codex 模型的 `high` 不是同一个量，不能当成同一条件下的对照。
model: claude-opus-5
# ★ 这里**不带** /v1 —— 与其它 teamorouter 档案相反，因为拼路径的人不同：
#   codex harness 把 `/responses` 拼在 base_url 后面（所以要带 /v1），
#   而 AnthropicBridge 拼的是 `/v1/chat/completions`（所以不能带，否则 /v1/v1）。
#   见 anthropic_bridge.py 的 `f"{upstream_base}/v1/chat/completions"`。
base_url: https://api.teamorouter.cn
api_key_env: ABHL_KEY_TEAMOROUTER
harness: cc
# 不写 client_name：那是 codex harness 报 originator 用的，cc 这条路不经过它。
# reasoning_effort 保留只为满足配置 schema，cc runtime 不消费（见上面 ⚠️）。
reasoning_effort: high
disable_response_storage: true
